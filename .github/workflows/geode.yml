name: Geode CI and Release

on:
  push:
    branches:
      - main
      - master
      - opus
      - 'migration/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Quality and browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.12.1
          runtime: node@26.7.0
          cache: true
          install: false

      - name: Verify toolchain
        shell: bash
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v26.7.0"
          test "$(pnpm --version)" = "12.12.1"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter geode-calibration exec playwright install --with-deps chromium

      - name: Start dev server
        shell: bash
        run: |
          pnpm dev > /tmp/geode-vite.log 2>&1 &
          echo $! > /tmp/geode-vite.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:1420/ >/dev/null; then
              echo "Dev server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server failed to start"
          cat /tmp/geode-vite.log
          exit 1

      - name: Browser regression tests
        run: |
          node .calibration/r23-e2e.mjs
          node .calibration/r24-e2e.mjs
          node .calibration/r276-e2e.mjs

  release-windows:
    name: Build and draft signed Windows release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.12.1
          runtime: node@26.7.0
          cache: true
          install: false

      - name: Verify toolchain
        shell: pwsh
        run: |
          node --version
          pnpm --version
          if ((node --version) -ne 'v26.7.0') { throw 'Expected Node.js v26.7.0.' }
          if ((pnpm --version) -ne '12.12.1') { throw 'Expected pnpm 12.12.1.' }

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag and app versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $configuration = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $configVersion = [string]$configuration.version
          $packageVersion = [string]$package.version

          if ($configVersion -ne $packageVersion) {
            throw "Version mismatch: tauri.conf.json is $configVersion but package.json is $packageVersion."
          }

          $expectedTag = "v$configVersion"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag '$env:RELEASE_TAG' does not match app version. Push tag '$expectedTag' after bumping both version files."
          }

          Write-Host "Validated release tag $expectedTag."

      - name: Verify updater signing secrets are available
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing repository Actions secret: TAURI_SIGNING_PRIVATE_KEY.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Missing repository Actions secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD.'
          }
          Write-Host 'Updater signing secrets are present.'

      - name: Build signed installer and create draft release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Geode ${{ github.ref_name }}
          releaseBody: |
            Signed Windows installer and updater metadata generated by GitHub Actions.

            This release was created as a draft. Install and verify the installer before publishing it.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
